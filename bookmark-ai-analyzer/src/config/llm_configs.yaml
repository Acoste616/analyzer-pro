# LLM Provider Configurations

grok:
  api_key: ${GROK_API_KEY}
  model: grok-beta
  base_url: https://api.x.ai/v1
  max_tokens: 4096
  temperature: 0.7
  timeout: 30
  max_retries: 3
  rate_limit: 60
  
claude:
  api_key: ${CLAUDE_API_KEY}
  model: claude-3-opus-20240229
  base_url: https://api.anthropic.com
  anthropic_version: 2023-06-01
  max_tokens: 4096
  temperature: 0.7
  timeout: 30
  max_retries: 3
  rate_limit: 60
  
gemini:
  api_key: ${GEMINI_API_KEY}
  model: gemini-pro
  base_url: https://generativelanguage.googleapis.com
  max_tokens: 4096
  temperature: 0.7
  timeout: 30
  max_retries: 3
  rate_limit: 60

# Model selection rules
model_selection:
  categorization:
    preferred: grok  # Optimized for social media
    fallback: claude
  
  content_analysis:
    preferred: claude  # Best for deep analysis
    fallback: gemini
  
  video_transcription:
    preferred: gemini  # Multimodal capabilities
    fallback: claude
  
  knowledge_extraction:
    preferred: claude  # Best for structured output
    fallback: grok