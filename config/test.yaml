app:
  name: "Bookmark AI Analyzer"
  version: "1.0.0"
  environment: "test"
  debug: true

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/test_bookmark_analyzer.log"
  max_size: 1048576  # 1MB
  backup_count: 2

database:
  type: "sqlite"
  path: ":memory:"
  pool_size: 5
  pool_timeout: 10

processing:
  batch_size: 5
  max_workers: 2
  checkpoint_interval: 10
  checkpoint_dir: "tests/fixtures/checkpoints"

extractors:
  twitter:
    base_url: "https://api.twitter.com/2"
    timeout: 10
    retry_attempts: 1
    rate_limit:
      requests_per_minute: 100
      
  web_scraping:
    timeout: 10
    retry_attempts: 1
    user_agent: "TestAgent/1.0"
    delay_between_requests: 0.1

analysis:
  default_llm_provider: "claude"
  enable_content_analysis: true
  enable_categorization: true
  enable_tagging: true
  similarity_threshold: 0.6
  
knowledge_base:
  output_dir: "tests/fixtures/knowledge_base"
  formats: ["json"]
  include_metadata: true
  
monitoring:
  enable_metrics: false
  metrics_port: 8081
  health_check_interval: 600