version: '3.8'

services:
  bookmark-analyzer:
    build: .
    image: bookmark-ai-analyzer:latest
    container_name: bookmark-analyzer
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MAX_WORKERS=4
      - BATCH_SIZE=10
      - CHECKPOINT_DIR=/app/data/checkpoints
      - CACHE_DIR=/app/data/cache
      # Add your API keys here or use .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - bookmark-network
    depends_on:
      - redis
      - postgres
    command: ["python", "scripts/run_analysis.py", "--input", "/app/data/raw/bookmarks.json", "--output", "/app/data/processed/"]

  redis:
    image: redis:7-alpine
    container_name: bookmark-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookmark-network
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: bookmark-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bookmark_analyzer
      - POSTGRES_USER=bookmark_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bookmark_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - bookmark-network

  # Optional: Web interface (placeholder for future implementation)
  web-interface:
    build: .
    image: bookmark-ai-analyzer:latest
    container_name: bookmark-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://bookmark_user:${POSTGRES_PASSWORD:-bookmark_password}@postgres:5432/bookmark_analyzer
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - bookmark-network
    depends_on:
      - redis
      - postgres
    command: ["python", "-c", "print('Web interface not implemented yet. Use CLI instead.')"]

  # Optional: Background task processor
  worker:
    build: .
    image: bookmark-ai-analyzer:latest
    container_name: bookmark-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MAX_WORKERS=2
      - BATCH_SIZE=5
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - bookmark-network
    depends_on:
      - redis
      - postgres
    command: ["python", "-c", "print('Background worker not implemented yet.')"]

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: bookmark-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - bookmark-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

networks:
  bookmark-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data: